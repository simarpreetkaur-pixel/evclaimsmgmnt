name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare static prototype build
        run: node scripts/github-pages/prepare.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static prototype
        run: pnpm build
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_ENV: staging
          NEXT_PUBLIC_BASE_PATH: /evclaimsmgmnt
          NEXT_PUBLIC_LOCAL_AUTH_BYPASS: true
          NEXT_PUBLIC_PROTOTYPE: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
